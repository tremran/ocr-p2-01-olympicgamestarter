
<div>
  <div>
    <div class="center">
      <div>{{ titlePage }}</div>
    </div>
    <div class="split">
      <app-information [text]="'Number of countries'" [value]="totalCountries" />
      <app-information [text]="'Number of JOs'" [value]="totalJOs" />
    </div>
  </div>
  <app-chart 
    [chartId]="pieChartId"
    [type]="'pie'"
    [labels]="countries"
    [data]="sumOfAllMedalsYears"
    [targetPage]="'country'"
  />
</div>
