<div>
  <div>
    <div class="center">
      <div>{{ titlePage }}</div>
    </div>
    <div class="split">
      <app-information [text]="'Number of entries'" [value]="totalEntries" />
      <app-information [text]="'Total Number of medals'" [value]="totalMedals" />
      <app-information [text]="'Total Number of athletes'" [value]="totalAthletes" />
    </div>
  </div>

  <app-chart 
    [chartId]="lineChartId"
    [type]="'line'"
    [labels]="years"
    [data]="medals"
  />
  
  <div class="center">
    <a routerLink="">Go back</a>
  </div>
</div>
