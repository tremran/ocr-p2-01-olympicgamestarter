<div *ngIf="country$ | async else notFound">
  <app-page-header
  [pageTitle]="country.country"
  [informations]="headerInfo"
  ></app-page-header>

  <app-chart
    [chartId]="lineChartId"
    [type]="'line'"
    [labels]="country.participationYears"
    [data]="country.medals"
  />
  
  <div class="center">
    <a routerLink="">Go back</a>
  </div>
</div>

<ng-template #notFound>
  <app-not-found [message]="'Country not found'"/>
</ng-template>
